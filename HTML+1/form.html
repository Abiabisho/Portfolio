<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            background-color: rgb(169, 196, 237);
            width: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid green;
            border-radius: 8px;
            height: auto;

        }

        h3 {
            color: white;
            font-size: 22px;
            text-align: center;
            text-transform: capitalize;
        }

        input {
            width: 80%;
            margin-left: 30px;
            padding: 10px;
            border: 1px solid rgb(169, 200, 197);
            border-radius: 5px;
        }

        button {
            background-color: orange;
            color: white;
            width: 100px;
            height: 50px;
            border: 1px solid rgb(208, 108, 108);
            border-radius: 5px;
            box-shadow: 2px 2px 2px rgb(17, 9, 178);


        }

        button:hover {
            background: orange;
            color: grey;
        }
    </style>
</head>

<body>

    <div class="main">
        <div>
            <h3>student registration form</h3>

        </div>
        <div>
            <form action="" method="post">


                <label for="">Name:</label><br>
                <input type="text" required placeholder="enter your name"><br>
                <label for="">Phone:</label><br>
                <input type="number" placeholder="enter you phone " required><br>

                <label for="">email:</label><br>
                <input type="email" placeholder="enter you email " required><br>
                <label for="">Age:</label><br>

                <input type="number" placeholder="enter your age " required min="18" max="50"><br>
                <label for="">birth date</label><br>
                <input type="date"><br>
                <label for="">user name</label><br>
                <input type="text"><br>
                <label for="">password</label><br>
                <input type="password"><br>
                <p>language</p>
                <input type="checkbox" name="English" id="" value="English">
                <label for="">English</label>
                <input type="checkbox" name="french" id="" value="french">
                <label for="">French</label>
                <input type="checkbox" name="detch" id="" value="dutch">
                <label for="">Dutch</label> <br>
                <p>Gender</p>
                <input type="radio" name="gender" value="male">
                <label for="">Male</label>
                <input type="radio" name="gender" value="female">
                <label for="">Female</label><br>
                <label for="">select your gender</label>
                <select name="" id="">
                    <option value="">Male</option>
                    <option value="">female</option>

                </select>


                <button type="submit">submit</button>




            </form>

        </div>




    </div>


</body>

</html>
